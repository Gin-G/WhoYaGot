server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell and its runtime config must never be cached, or a deploy would
    # leave browsers pinned to the previous build and the previous API URL.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Same-origin API, so the browser never makes a cross-origin request and
    # CORS stops mattering for the web build.
    location /api/ {
        proxy_pass __API_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The app uses hash routing, but a stray deep link should still land on the
    # shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
