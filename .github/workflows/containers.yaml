# Builds, verifies and publishes the two images that run the site:
#
#   ncging/whoyagot-api   FastAPI — votes, ratings, users
#   ncging/whoyagot-web   nginx serving the built SPA, proxying /api to the API
#
# The images are started and exercised before anything is pushed, so a build
# that compiles but does not serve never reaches the registry.
#
# After a successful push it writes the new tag into helm/whoyagot/values.yaml
# and commits it. ArgoCD watches the chart, so that commit is the deploy.
#
# Publishing needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Without them the job
# still builds and verifies, and simply skips the push — so the workflow is
# useful before the registry is set up, and starts publishing the moment the
# secrets are added.
#
# The web image carries no environment-specific values. It reads API_UPSTREAM,
# PUBLIC_API_URL and GOOGLE_CLIENT_ID at container start-up and writes them into
# config.js, so the same tag runs anywhere.

name: Container images

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/containers.yaml
      - .github/workflows/ci.yaml
  workflow_dispatch:

jobs:
  test:
    name: Test before publishing
    uses: ./.github/workflows/ci.yaml

  images:
    name: Build, verify & publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the chart's new image tags
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built into the local daemon first so the verify steps below exercise
      # the exact images that get pushed.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: whoyagot-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: whoyagot-web:ci

      - name: Start the stack
        run: |
          docker network create wyg
          docker run -d --name api --network wyg \
            -e DATABASE_URL=sqlite:////tmp/verify.db \
            whoyagot-api:ci
          docker run -d --name web --network wyg -p 8080:8080 \
            -e API_UPSTREAM=http://api:8000 \
            -e GOOGLE_CLIENT_ID=verify.apps.googleusercontent.com \
            whoyagot-web:ci

      - name: Wait for both to answer
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://localhost:8080/healthz >/dev/null \
               && curl -sf --max-time 5 http://localhost:8080/api/health >/dev/null; then
              echo "stack is up (attempt $i)"; exit 0
            fi
            sleep 3
          done
          echo "stack did not come up"; docker logs api; docker logs web; exit 1

      - name: API is reachable through the web container's proxy
        run: curl -sf http://localhost:8080/api/health | jq -e '.status == "healthy"'

      # The whole point of the runtime config: this value was never baked in.
      - name: Runtime config was injected at start-up
        run: |
          curl -sf http://localhost:8080/config.js | tee /dev/stderr \
            | grep -q 'verify.apps.googleusercontent.com'

      - name: The SPA shell is served
        run: curl -sf http://localhost:8080/ | grep -q '<div id="root">'

      - name: Tear down
        if: always()
        run: docker rm -f api web >/dev/null 2>&1 || true

      # `secrets` cannot be read from a job-level `if`, so the presence check
      # happens here and the push steps key off its output.
      - name: Check for DockerHub credentials
        id: registry
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set. Images were built and verified but not published."
          fi

      - name: Log in to DockerHub
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        if: steps.registry.outputs.publish == 'true'
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      # Tag and push the images the checks above just exercised, rather than
      # rebuilding them. A rebuild here would produce different bytes than the
      # ones that were verified.
      - name: Push images
        if: steps.registry.outputs.publish == 'true'
        run: |
          TAG="${{ steps.date.outputs.date }}"
          for name in api web; do
            for ref in latest "$TAG" "${{ github.sha }}"; do
              docker tag "whoyagot-${name}:ci" "ncging/whoyagot-${name}:${ref}"
              docker push "ncging/whoyagot-${name}:${ref}"
            done
          done

      # ArgoCD watches the chart, so committing the new tags is the deploy.
      # This only touches helm/, which is not in this workflow's path filter,
      # so the commit does not trigger another run.
      - name: Point the Helm chart at the new images
        if: steps.registry.outputs.publish == 'true'
        run: |
          TAG="${{ steps.date.outputs.date }}"
          sed -i "s|image: docker.io/ncging/whoyagot-api:.*|image: docker.io/ncging/whoyagot-api:${TAG}|" \
            helm/whoyagot/values.yaml
          sed -i "s|image: docker.io/ncging/whoyagot-web:.*|image: docker.io/ncging/whoyagot-web:${TAG}|" \
            helm/whoyagot/values.yaml

          # A sed that silently matched nothing would leave ArgoCD deploying the
          # previous image while the run reports success.
          grep -q "whoyagot-api:${TAG}" helm/whoyagot/values.yaml \
            && grep -q "whoyagot-web:${TAG}" helm/whoyagot/values.yaml \
            || { echo "::error::Failed to update image tags in helm/whoyagot/values.yaml"; exit 1; }
          grep -E 'image: docker.io/ncging/whoyagot-(api|web):' helm/whoyagot/values.yaml

      - name: Commit the chart update
        if: steps.registry.outputs.publish == 'true'
        run: |
          if git diff --quiet -- helm/whoyagot/values.yaml; then
            echo "Chart already points at this tag; nothing to commit."
            exit 0
          fi
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config user.name "$GITHUB_ACTOR"
          git add helm/whoyagot/values.yaml
          git commit -m "ci: deploy whoyagot-api and whoyagot-web ${{ steps.date.outputs.date }}"
          git pull --rebase
          git push
