# Builds, verifies and publishes the two images that run the site:
#
#   ncging/whoyagot-api   FastAPI — votes, ratings, users
#   ncging/whoyagot-web   nginx serving the built SPA, proxying /api to the API
#
# The images are started and exercised before anything is pushed, so a build
# that compiles but does not serve never reaches the registry.
#
# Publishing needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Without them the job
# still builds and verifies, and simply skips the push — so the workflow is
# useful before the registry is set up, and starts publishing the moment the
# secrets are added.
#
# The web image carries no environment-specific values. It reads API_UPSTREAM,
# PUBLIC_API_URL and GOOGLE_CLIENT_ID at container start-up and writes them into
# config.js, so the same tag runs anywhere.

name: Container images

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/containers.yaml
      - .github/workflows/ci.yaml
  workflow_dispatch:

jobs:
  test:
    name: Test before publishing
    uses: ./.github/workflows/ci.yaml

  images:
    name: Build, verify & publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built into the local daemon first so the verify steps below exercise
      # the exact images that get pushed.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: whoyagot-api:ci
          cache-from: type=gha,scope=whoyagot-api
          cache-to: type=gha,mode=max,scope=whoyagot-api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: whoyagot-web:ci
          cache-from: type=gha,scope=whoyagot-web
          cache-to: type=gha,mode=max,scope=whoyagot-web

      - name: Start the stack
        run: |
          docker network create wyg
          docker run -d --name api --network wyg \
            -e DATABASE_URL=sqlite:////tmp/verify.db \
            whoyagot-api:ci
          docker run -d --name web --network wyg -p 8080:8080 \
            -e API_UPSTREAM=http://api:8000 \
            -e GOOGLE_CLIENT_ID=verify.apps.googleusercontent.com \
            whoyagot-web:ci

      - name: Wait for both to answer
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://localhost:8080/healthz >/dev/null \
               && curl -sf --max-time 5 http://localhost:8080/api/health >/dev/null; then
              echo "stack is up (attempt $i)"; exit 0
            fi
            sleep 3
          done
          echo "stack did not come up"; docker logs api; docker logs web; exit 1

      - name: API is reachable through the web container's proxy
        run: curl -sf http://localhost:8080/api/health | jq -e '.status == "healthy"'

      # The whole point of the runtime config: this value was never baked in.
      - name: Runtime config was injected at start-up
        run: |
          curl -sf http://localhost:8080/config.js | tee /dev/stderr \
            | grep -q 'verify.apps.googleusercontent.com'

      - name: The SPA shell is served
        run: curl -sf http://localhost:8080/ | grep -q '<div id="root">'

      - name: Tear down
        if: always()
        run: docker rm -f api web >/dev/null 2>&1 || true

      # `secrets` cannot be read from a job-level `if`, so the presence check
      # happens here and the push steps key off its output.
      - name: Check for DockerHub credentials
        id: registry
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set. Images were built and verified but not published."
          fi

      - name: Log in to DockerHub
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        if: steps.registry.outputs.publish == 'true'
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      # Every layer is already in the build cache, so these are near-instant.
      - name: Push api image
        if: steps.registry.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ncging/whoyagot-api:latest
            ncging/whoyagot-api:${{ steps.date.outputs.date }}
            ncging/whoyagot-api:${{ github.sha }}
          cache-from: type=gha,scope=whoyagot-api

      - name: Push web image
        if: steps.registry.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ncging/whoyagot-web:latest
            ncging/whoyagot-web:${{ steps.date.outputs.date }}
            ncging/whoyagot-web:${{ github.sha }}
          cache-from: type=gha,scope=whoyagot-web
