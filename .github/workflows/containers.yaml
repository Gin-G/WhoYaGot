# Builds and pushes the two images that run the site:
#
#   ncging/whoyagot-api   FastAPI — votes, ratings, users
#   ncging/whoyagot-web   nginx serving the built SPA, proxying /api to the API
#
# The web image carries no environment-specific values. It reads API_UPSTREAM,
# PUBLIC_API_URL and GOOGLE_CLIENT_ID at container start-up and writes them into
# config.js, so the same tag runs anywhere.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME   - DockerHub login
#   DOCKERHUB_TOKEN      - DockerHub access token

name: Container images

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/containers.yaml
  workflow_dispatch:

jobs:
  test:
    name: Test before publishing
    uses: ./.github/workflows/ci.yaml

  build:
    name: Build & push ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ncging/whoyagot-${{ matrix.name }}:latest
            ncging/whoyagot-${{ matrix.name }}:${{ steps.date.outputs.date }}
            ncging/whoyagot-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=whoyagot-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=whoyagot-${{ matrix.name }}

  verify:
    name: Run the images and check they serve
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the stack
        run: |
          docker network create wyg
          docker run -d --name api --network wyg \
            -e DATABASE_URL=sqlite:////tmp/verify.db \
            ncging/whoyagot-api:${{ github.sha }}
          docker run -d --name web --network wyg -p 8080:8080 \
            -e API_UPSTREAM=http://api:8000 \
            -e GOOGLE_CLIENT_ID=verify.apps.googleusercontent.com \
            ncging/whoyagot-web:${{ github.sha }}

      - name: Wait for both to answer
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://localhost:8080/healthz >/dev/null \
               && curl -sf --max-time 5 http://localhost:8080/api/health >/dev/null; then
              echo "stack is up (attempt $i)"; exit 0
            fi
            sleep 3
          done
          echo "stack did not come up"; docker logs api; docker logs web; exit 1

      - name: API is reachable through the web container's proxy
        run: curl -sf http://localhost:8080/api/health | jq -e '.status == "healthy"'

      # The whole point of the runtime config: this value was never baked in.
      - name: Runtime config was injected at start-up
        run: |
          curl -sf http://localhost:8080/config.js | tee /dev/stderr \
            | grep -q 'verify.apps.googleusercontent.com'

      - name: The SPA shell is served
        run: curl -sf http://localhost:8080/ | grep -q '<div id="root">'

      - name: Tear down
        if: always()
        run: docker rm -f api web || true
