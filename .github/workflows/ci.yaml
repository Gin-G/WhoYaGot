# Gate for pull requests: backend tests and a frontend type-check + build.
# Nothing here needs a secret, so it runs on forks too.

name: CI

concurrency:
  # Keyed by the calling workflow as well as the ref: when the container
  # workflow calls this one, both are in flight for the same ref, and a shared
  # group would have them cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the container workflow so images are never published untested.
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --quiet -r requirements.txt

      - name: Run tests
        working-directory: backend/app
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this type-checks too.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
