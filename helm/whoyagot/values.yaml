group: whoyagot

# ── API ──────────────────────────────────────────────────────────────────────
api:
  name: whoyagot-api
  replicaCount: 1
  container:
    # CI rewrites the tag on this line after each successful build, and ArgoCD
    # deploys the result. Keep the repository and tag together on one line.
    image: docker.io/ncging/whoyagot-api:2026-08-06.01.49
    imagePullPolicy: Always
    port: 8000
    memoryRequest: "256Mi"
    memoryLimit: "1Gi"
    cpuRequest: "100m"
    cpuLimit: "1"
  # Where player data comes from.
  nflApiUrl: https://nfl-api.nickknows.net
  # Pins the roster sync to one season. Empty works it out from the date — the
  # league year turns over in March — which is what normal running wants. Set it
  # to hold the pool on a particular season without a code change; during camp,
  # for instance, "2025" keeps the tighter post-cuts pool at the cost of showing
  # last season's teams.
  nflSeason: ""

# ── Web ──────────────────────────────────────────────────────────────────────
web:
  name: whoyagot-web
  replicaCount: 2
  container:
    # CI rewrites the tag on this line too.
    image: docker.io/ncging/whoyagot-web:2026-08-06.01.49
    imagePullPolicy: Always
    port: 8080
    memoryRequest: "32Mi"
    memoryLimit: "128Mi"
    cpuRequest: "10m"
    cpuLimit: "500m"
  # What the browser calls. Same-origin by default: nginx in this pod proxies
  # /api to the API service, so the browser never makes a cross-origin request.
  publicApiUrl: /api

# Google OAuth *web* client ID — the one the browser runs the sign-in flow with.
# Not a secret, since it ships to every browser, so it lives here rather than in
# OpenBao. Empty disables the sign-in button; voting still works anonymously.
googleClientId: "669358293293-0cl1t2tkdcjf37jlf4msd80p3of82mf9.apps.googleusercontent.com"

# Other OAuth clients whose ID tokens the API should also accept. Google stamps
# the requesting client into the token's aud, so an Android build signing in with
# its own client needs that ID listed here. The browser never sees these — it
# gets googleClientId alone, because GSI takes exactly one.
extraGoogleClientIds: []
  # - your-android-client-id.apps.googleusercontent.com

# ── Ingress ──────────────────────────────────────────────────────────────────
# One hostname. The web pod serves the site and proxies /api to the API, so the
# API is reachable at https://<fqdn>/api — which is also what the Android build
# should use for PUBLIC_API_URL.
ingress:
  enabled: true
  className: traefik
  fqdn: whoyagot.nickknows.net
  path: /
  clusterIssuer: letsencrypt-cloudflare
  externalDnsTarget: "8.44.158.127"
  # Attach a Traefik security-headers Middleware (HSTS, nosniff, frame-deny).
  # No CSP, so Google sign-in and remote headshot images keep working.
  securityHeaders: true

# ── Player sync ──────────────────────────────────────────────────────────────
sync:
  enabled: true
  # Nightly, after rosters settle.
  schedule: "0 9 * * *"
  leagues:
    - nfl

# ── Secrets (OpenBao via External Secrets) ───────────────────────────────────
secrets:
  path: whoyagot
  targetSecret: whoyagot-secrets
  jwtSecretProperty: jwt_secret
  adminTokenProperty: admin_token
  secretStore:
    # Set false if a SecretStore already exists in this namespace.
    create: true
    name: openbao-backend
    server: http://openbao.openbao.svc.cluster.local:8200
    path: kv
    credentialsSecret: openbao-credentials

# ── Database (CloudNativePG) ─────────────────────────────────────────────────
# In this chart rather than a separate one, so the whole app is a single ArgoCD
# Application. Set enabled: false to point at a cluster managed elsewhere.
postgres:
  enabled: true
  name: whoyagot-db
  instances: 1
  size: 5Gi
  # Network-attached, so the DB is not pinned to a single node.
  storageClass: rook-ceph-block
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  parameters:
    shared_buffers: 256MB
    work_mem: 16MB
    maintenance_work_mem: 128MB
    effective_cache_size: 768MB
  secretPath: whoyagot
  app:
    name: whoyagot-db
    # Must equal the app-user username in OpenBao (whoyagot/dbuser). CNPG names
    # the owning role from this field but takes the password from the secret, so
    # a mismatch bootstraps a role the API can never authenticate as.
    owner: whoyagot
  superuser:
    userKey: dbsu
    passwordKey: dbsupassw
  appuser:
    userKey: dbuser
    passwordKey: dbpassw
