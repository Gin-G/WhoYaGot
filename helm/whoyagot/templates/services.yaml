apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.api.name }}
    group: {{ .Values.group }}
spec:
  # ClusterIP: only the web pod and the ingress need to reach these, so there is
  # no reason to open a port on every node.
  type: ClusterIP
  ports:
    - port: {{ .Values.api.container.port }}
      targetPort: {{ .Values.api.container.port }}
      name: http
  selector:
    app: {{ .Values.api.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.web.name }}
    group: {{ .Values.group }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.container.port }}
      targetPort: {{ .Values.web.container.port }}
      name: http
  selector:
    app: {{ .Values.web.name }}
