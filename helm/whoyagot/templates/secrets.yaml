{{- if .Values.secrets.secretStore.create }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secrets.secretStore.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    vault:
      auth:
        tokenSecretRef:
          key: OPENBAO_TOKEN
          name: {{ .Values.secrets.secretStore.credentialsSecret }}
      path: {{ .Values.secrets.secretStore.path }}
      server: {{ .Values.secrets.secretStore.server }}
      version: v2
---
{{- end }}
# JWT_SECRET signs session tokens; ADMIN_TOKEN guards POST /admin/sync. Both are
# marked optional on the deployment, so a missing store degrades to warnings at
# start-up rather than a crashloop.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.api.name }}-secrets-eso
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.targetSecret }}
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.secrets.path }}
        property: {{ .Values.secrets.jwtSecretProperty }}
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: {{ .Values.secrets.path }}
        property: {{ .Values.secrets.adminTokenProperty }}
